server:
  port: 8081
  
spring:
  application:
    name: Team4_BE
  messages:
    encoding: UTF-8

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/linkfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false
      data-source-properties:
        serverTimezone: Asia/Seoul

  jpa:
    hibernate:
      ddl-auto: update
      format_sql: true
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

jwt:
  expiration-time: 1800000
  master:
    token:
      user: mastertoken-user
      trainer: mastertoken-trainer
    id: 1
    role:
      user: user
      trainer: trainer

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: nurspace-bucket
    stack:
      auto: false

kakao:
  api-key: ${KAKAO_API_KEY}
  address-search-url: https://dapi.kakao.com/v2/local/search/address.json

default-image-url: https://nurspace-bucket.s3.ap-northeast-2.amazonaws.com/default_profile.png

#prometheus 설정

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, httpexchanges
  metrics:
    tags:
      application: linkfit
  endpoint:
    info:
      enabled: true
    refresh:
      enabled: true
    health:
      enabled: true
    beans:
      enabled: true
    httpexchanges:
      enabled: true
